<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>謝謝你...？</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --main-color: #ff6b9d;
    --glow-color: rgba(255,107,157,0.5);
    --bg-color: #0d0d0d;
    --halo-color: rgba(255,107,157,0.15);
  }

  html, body {
    height: 100%;
    background: var(--bg-color);
    overflow: hidden;
    font-family: "Courier New", monospace;
  }

  /* ============ 打字階段 ============ */
  #typingStage {
    position: fixed;
    inset: 0;
    z-index: 5;
  }
  #typingStage.hide {
    opacity: 0;
    transition: opacity 1.5s ease;
    pointer-events: none;
  }

  .drip {
    position: relative;
    display: inline-block;
  }

  /* 血滴本體 */
  .drip::after {
    content: "";
    position: absolute;
    top: 100%;                    
    left: 30%;
    width: 4px;
    height: 0;
    background: linear-gradient(to bottom,
      #ff2d4d 0%,
      #cc0033 50%,
      #8b0000 100%);
    border-radius: 0 0 50% 50% / 0 0 100% 100%;  
    box-shadow:
      0 0 8px rgba(255,45,77,0.9),
      0 0 16px rgba(255,45,77,0.5);
    animation: drip 2.5s ease-in infinite;
    transform-origin: top center;
  }

  /* 第二條血滴 */
  .drip::before {
    content: "";
    position: absolute;
    top: 100%;
    left: 70%;
    width: 3px;
    height: 0;
    background: linear-gradient(to bottom,
      #ff2d4d 0%,
      #cc0033 50%,
      #8b0000 100%);
    border-radius: 0 0 50% 50% / 0 0 100% 100%;
    box-shadow:
      0 0 8px rgba(255,45,77,0.9),
      0 0 16px rgba(255,45,77,0.5);
    animation: drip 2.5s ease-in infinite 1.2s;
    transform-origin: top center;
  }

  /* 滴落動畫 */
  @keyframes drip {
    0% {
      height: 0;
      opacity: 0;
      transform: scaleY(0);
    }
    15% {
      height: 4px;
      opacity: 1;
      transform: scaleY(1);
    }
    70% {
      height: 45px;
      opacity: 1;
      transform: scaleY(1);
    }
    85% {
      height: 55px;
      opacity: 0.8;
    }
    100% {
      height: 70px;
      opacity: 0;
      transform: scaleY(1.1) translateY(10px);
    }
  }

  .page {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0 30px;
    opacity: 0;
    transition: opacity 1s ease;
    pointer-events: none;
  }
  .page.active {
    opacity: 1;
    pointer-events: auto;
  }

  .text {
    font-size: clamp(1.2rem, 3vw, 2rem);
    color: var(--main-color);
    line-height: 2;
    max-width: 800px;
    text-align: center;
    text-shadow: 0 0 10px var(--glow-color);
    white-space: pre-wrap;
  }

  .cursor {
    display: inline-block;
    width: 3px;
    height: 1em;
    background: var(--main-color);
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 0.7s step-end infinite;
    box-shadow: 0 0 10px var(--main-color);
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  .page.final .text {
    font-size: clamp(1.8rem, 5vw, 3rem);
    color: var(--main-color);
    text-shadow:
      0 0 20px var(--main-color),
      0 0 40px var(--main-color),
      0 0 80px var(--glow-color);
    animation: glow 2s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(1.4); }
  }

  /* 背景微光 */
  .glow {
  position: fixed;
  top: 50%; left: 50%;
  width: 600px; height: 600px;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, var(--halo-color), transparent 70%);
  pointer-events: none;
  z-index: 0;
  opacity: 0;
  transition: opacity 2s ease, background 2s ease;
  }

  .glow.show {
    opacity: 1;
    animation: breathe 6s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% {
      transform: translate(-50%, -50%) scale(1);
      opacity: 0.7;
      filter: brightness(1);
    }
    50% {
      transform: translate(-50%, -50%) scale(1.25);
      opacity: 1;
      filter: brightness(1.5);
    }
}

  /* ============ 彩蛋階段 ============ */
  #eggStage {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
    opacity: 0;
    transition: opacity 1.5s ease;
    pointer-events: none;
  }
  #eggStage.show {
    opacity: 1;
    pointer-events: auto;
  }

  #msg {
    font-size: clamp(1.5rem, 4vw, 3rem);
    letter-spacing: 0.15em;
    text-align: center;
    color: var(--main-color);
    text-shadow:
      0 0 15px var(--glow-color),
      0 0 35px var(--glow-color);
    opacity: 0;
    transform: translateY(20px);
    transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
    padding: 0 20px;
    white-space: pre-wrap;
  }
  #msg.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

  <div class="glow" id="bgGlow"></div>

  <!-- 打字階段 -->
  <div id="typingStage">
    <div id="container"></div>
  </div>

  <!-- 彩蛋階段 -->
  <div id="eggStage">
    <div id="msg"></div>
  </div>

<script>
/*  ======  打字階段的句子 ====== */
const lines = [
  { text: "嗨" },
  { text: "我曾以為那年回憶可以留住幸福的夢，" },
  { text: "直到身影在前，才知道其實不敢抓住，" },
  { text: "不是不敢抓，而是早已錯過抓住的機會了..." },
  { text: "只不過是希望擁有，有錯嗎？" },
  { text: "或許我的存在本身就是錯誤吧，", 
    color: "#ff2d4d",                     
    bg:    "#0d0d0d",                    
    glow:  "rgba(255,45,77,0.6)",       
    halo:  "rgba(255,45,77,0.15)"        
  },
  { text: "所以才會錯過，才會無法抓住，" },
  { text: "因為其實一開始我就知道自己是「不存在的」。",
    color: "#c8c8c8", 
    bg: "#0d0d0d",
    glow: "rgba(200,200,200,0.5)", 
    halo: "rgba(200,200,200,0.12)"
},
  { text: "也許也曾真實存在過，" },
  { text: "只是存在的意義已經消失了。" },
  { text: "已經忘了為什麼停留在這了。" },
  { text: "..." },
  { text: "所以「我」是誰呢？", 
    drip: true,
  },
  { text: "又是為了什麼而曾經存在過呢。" },
];

/* 打字參數 */
const CHAR_DELAY = 120;        // 每字間隔(ms)
const PUNCT_DELAY = 400;       // 標點停頓(ms)
const AFTER_LINE_DELAY = 1500; // 每句打完停留(ms)
const FADE_TIME = 600;         // 淡入淡出(ms)
const FINAL_HOLD = 3500;       // 最後一句停留多久後進彩蛋(ms)

/* ====== 彩蛋階段 ====== */
const stages = [
  { t: 3000,  text: "你還在嗎？ 👀", 
    color: "#ff6b9d", 
    bg: "#0d0d0d",
    glow: "rgba(255,107,157,0.5)", 
    halo: "rgba(255,107,157,0.15)"
  },
  { t: 7000,  text: "其實我一直看著你" },
  { t: 11000, text: "有件事想跟你說..." },
  { t: 15000, text: "謝謝你..." },
];

/* ====== 打字階段 ====== */
function changeColors({ color, bg, glow, halo }) {
  const root = document.documentElement;
  if (color) root.style.setProperty('--main-color', color);
  if (bg)    root.style.setProperty('--bg-color', bg);
  if (glow)  root.style.setProperty('--glow-color', glow);
  if (halo)  root.style.setProperty('--halo-color', halo);
}

const container = document.getElementById("container");
const bgGlow = document.getElementById("bgGlow");

const pages = lines.map((item, i) => {
  const page = document.createElement("div");
  page.className = "page" + (i === lines.length - 1 ? " final" : "");

  const text = document.createElement("div");
  text.className = "text";

  const span = document.createElement("span");
  if (item.drip) span.className = "drip";
  const cursor = document.createElement("span");
  cursor.className = "cursor";

  text.appendChild(span);
  text.appendChild(cursor);
  page.appendChild(text);
  container.appendChild(page);

  return { el: page, textEl: span, cursorEl: cursor, line: item.text, config: item };
});

function typeLine(pageObj) {
  return new Promise(resolve => {
    const { textEl, line } = pageObj;
    let i = 0;
    function step() {
      if (i < line.length) {
        textEl.textContent += line[i];
        const ch = line[i];
        i++;
        const d = "，。…！".includes(ch) ? PUNCT_DELAY : CHAR_DELAY;
        setTimeout(step, d);
      } else resolve();
    }
    step();
  });
}

function startEggStage() {
  document.getElementById("typingStage").classList.add("hide");
  setTimeout(() => {
    document.getElementById("typingStage").style.display = "none";
    document.getElementById("eggStage").classList.add("show");
    runEggs();
  }, 1500);
}

async function playTyping() {
  setTimeout(() => bgGlow.classList.add("show"), 300);

  for (let i = 0; i < pages.length; i++) {
    const page = pages[i];

    if (page.config.color || page.config.bg) {
      changeColors(page.config);
    }

    page.el.classList.add("active");
    await new Promise(r => setTimeout(r, FADE_TIME));
    await typeLine(page);

    if (i === pages.length - 1) {
      await new Promise(r => setTimeout(r, FINAL_HOLD));
      startEggStage();
      return;
    }

    await new Promise(r => setTimeout(r, AFTER_LINE_DELAY));
    page.cursorEl.style.animation = "none";
    page.cursorEl.style.opacity = "0";
    page.el.classList.remove("active");
    await new Promise(r => setTimeout(r, FADE_TIME));
  }
}

/* ====== 彩蛋階段 ====== */
function runEggs() {
  const msg = document.getElementById("msg");

  stages.forEach(s => {
    setTimeout(() => {
      msg.classList.remove("show");
      setTimeout(() => {
        msg.textContent = s.text;
        changeColors(s);
        msg.classList.add("show");
      }, 400);
    }, s.t);
  });
}

playTyping();
</script>
</body>
</html>
